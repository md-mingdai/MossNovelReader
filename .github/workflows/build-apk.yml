name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 也可以在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write           # 用于把 APK 发布到 Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已经预装了 Android SDK，这里只需要接受许可
      - name: 接受 Android SDK 许可
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # 失败时把错误摘要写到运行页的 Summary，不登录也能看到
      - name: 错误摘要（仅失败时）
        if: failure()
        run: |
          {
            echo '## 构建失败：错误摘要'
            echo '```'
            if [ -f build.log ]; then grep -E "^e: |^w: .*error|What went wrong|Execution failed|Could not |FAILURE|error:" build.log | head -80 || true; fi
            echo '```'
            echo '### 日志末尾'
            echo '```'
            if [ -f build.log ]; then tail -60 build.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: MossNovelReader-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（方便手机直接下载）
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
