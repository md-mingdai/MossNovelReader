name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 也可以在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write           # 用于把 APK 发布到 Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK（并接受许可）
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 APK（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: MossNovelReader-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（方便手机直接下载）
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
